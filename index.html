<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DH1Q PROTOCOL | 创作大脑</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;500;900&display=swap');
        :root { --accent: #00ff41; --bg: #0a0a0a; }
        body { background-color: var(--bg); color: #e0e0e0; font-family: 'Noto Sans SC', sans-serif; margin: 0; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; }
        .accent-glow { box-shadow: 0 0 20px rgba(0, 255, 65, 0.2); }
        textarea:focus { outline: none; border-color: var(--accent) !important; }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase SDK (UMD) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script type="text/babel">
        // ############################################################
        // 关键：请在此处填入你的真实配置
        // ############################################################
        const firebaseConfig = {
            apiKey: "AIzaSyDoaqc3o1eWZdMEGqLNc8DLbVAVqultvv0",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY";

        // 初始化
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = "dh1q-protocol-prod";

        const { useState, useEffect, useMemo } = React;

        // 高亮解析组件
        const HighlightText = ({ text }) => {
            if (!text) return null;
            const parts = text.split(/(\*\*.*?\*\*)/g);
            return (
                <span>
                    {parts.map((part, i) => 
                        part.startsWith('**') && part.endsWith('**') ? (
                            <span key={i} className="text-[#00ff41] font-bold bg-[#00ff41]/10 px-1 rounded mx-0.5">{part.slice(2, -2)}</span>
                        ) : part
                    )}
                </span>
            );
        };

        function App() {
            const [activeTab, setActiveTab] = useState('capture');
            const [inputText, setInputText] = useState('');
            const [posts, setPosts] = useState([]);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [script, setScript] = useState(null);
            const [selectedPost, setSelectedPost] = useState(null);

            useEffect(() => {
                auth.signInAnonymously().catch(console.error);
                const unsubscribe = db.collection('artifacts').doc(appId).collection('threads_posts')
                    .onSnapshot(snapshot => {
                        const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setPosts(data.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)));
                    });
                return () => unsubscribe();
            }, []);

            const tagStats = useMemo(() => {
                const stats = {};
                posts.forEach(p => p.tags?.forEach(t => stats[t] = (stats[t] || 0) + 1));
                return Object.entries(stats).sort((a, b) => b[1] - a[1]);
            }, [posts]);

            const handleAnalyze = async () => {
                if (!inputText.trim()) return;
                setIsAnalyzing(true);
                try {
                    const prompt = `你是一位高阶内容导演。分析以下Threads串文，提取3个标签，提炼逻辑，并提供一个带有 **关键词** (加双星号) 标注的电影感拍摄建议(match)。必须使用简体中文。内容: ${inputText}`;
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });
                    const result = await response.json();
                    const analysis = JSON.parse(result.candidates[0].content.parts[0].text);

                    await db.collection('artifacts').doc(appId).collection('threads_posts').add({
                        content: inputText,
                        tags: analysis.tags || [],
                        logic: analysis.logic || "",
                        match: analysis.match || "",
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    setInputText('');
                    setActiveTab('library');
                } catch (e) {
                    alert("分析异常，请检查 API 配置或网络");
                } finally { setIsAnalyzing(false); }
            };

            const generateScript = async (post) => {
                setSelectedPost(post);
                setScript("正在锻造脚本...");
                setActiveTab('script');
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `为这段观点生成20秒硬核转场脚本，用**双星号**标注视觉重点。观点: ${post.content}` }] }]
                        })
                    });
                    const res = await response.json();
                    setScript(res.candidates[0].content.parts[0].text);
                } catch (e) { setScript("生成失败"); }
            };

            return (
                <div className="min-h-screen flex flex-col max-w-4xl mx-auto px-4 py-8">
                    <header className="mb-12 flex justify-between items-end border-b border-white/10 pb-6">
                        <div>
                            <h1 className="text-4xl font-black italic tracking-tighter text-[#00ff41]">DH1Q PROTOCOL</h1>
                            <p className="mono text-[10px] text-zinc-600 mt-2 uppercase tracking-widest">Creator's Production OS</p>
                        </div>
                        <nav className="flex gap-6 mono text-xs">
                            {['capture', 'library', 'script'].map(t => (
                                <button key={t} onClick={() => setActiveTab(t)} className={`uppercase font-bold transition-all ${activeTab === t ? 'text-[#00ff41] border-b-2 border-[#00ff41]' : 'text-zinc-600'}`}>
                                    {t === 'capture' ? '捕获' : t === 'library' ? '灵感库' : '生产'}
                                </button>
                            ))}
                        </nav>
                    </header>

                    {activeTab === 'capture' && (
                        <div className="space-y-8 animate-in fade-in">
                            <div className="glass p-8 accent-glow">
                                <textarea 
                                    className="w-full h-48 bg-transparent border-none text-xl placeholder:text-zinc-800 resize-none font-medium leading-relaxed"
                                    placeholder="在此倾倒你的灵感或粘贴链接..."
                                    value={inputText}
                                    onChange={(e) => setInputText(e.target.value)}
                                />
                                <button onClick={handleAnalyze} disabled={isAnalyzing} className="w-full py-5 bg-[#00ff41] text-black font-black rounded-2xl mt-6 uppercase tracking-widest text-sm active:scale-95 transition-all">
                                    {isAnalyzing ? "正在进行高阶内化..." : "一键分析并存入仓库"}
                                </button>
                            </div>
                        </div>
                    )}

                    {activeTab === 'library' && (
                        <div className="space-y-8 animate-in fade-in">
                            {tagStats.length > 0 && (
                                <div className="flex flex-wrap gap-2">
                                    {tagStats.map(([t, c]) => (
                                        <div key={t} className="bg-zinc-900 px-3 py-1 rounded-full text-[10px] font-bold border border-white/5">
                                            {t} <span className="text-[#00ff41] ml-1">{c}</span>
                                        </div>
                                    ))}
                                </div>
                            )}
                            <div className="grid grid-cols-1 gap-6">
                                {posts.map(p => (
                                    <div key={p.id} className="glass p-6 border-white/5 hover:border-[#00ff41]/30 transition-all">
                                        <div className="flex gap-2 mb-4">
                                            {p.tags?.map(t => <span key={t} className="text-[10px] text-[#00ff41] border border-[#00ff41]/20 px-2 py-0.5 rounded-full uppercase font-black">{t}</span>)}
                                        </div>
                                        <p className="text-zinc-300 mb-6 italic">"{p.content}"</p>
                                        <div className="bg-white/5 p-5 rounded-xl mb-6">
                                            <div className="text-[10px] font-black text-[#00ff41] mb-2 uppercase">Directorial Vision</div>
                                            <p className="text-sm leading-relaxed"><HighlightText text={p.match} /></p>
                                        </div>
                                        <div className="flex justify-between items-center border-t border-white/5 pt-4">
                                            <button onClick={() => db.collection('artifacts').doc(appId).collection('threads_posts').doc(p.id).delete()} className="text-[10px] text-zinc-600 hover:text-red-500">REMOVE</button>
                                            <button onClick={() => generateScript(p)} className="bg-white text-black px-4 py-1.5 rounded-full text-[10px] font-black uppercase">生成执行脚本</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {activeTab === 'script' && (
                        <div className="glass p-8 animate-in fade-in">
                            <h2 className="text-sm font-black text-[#00ff41] mb-6 uppercase tracking-widest border-b border-white/5 pb-4">Production Script</h2>
                            <div className="prose prose-invert max-w-none text-base leading-loose">
                                <HighlightText text={script || "请从灵感库选择内容进行锻造。"} />
                            </div>
                            {script && <button onClick={() => window.print()} className="w-full py-4 border border-[#00ff41] text-[#00ff41] font-bold rounded-xl mt-12 uppercase tracking-widest text-xs">导出拍摄指南</button>}
                        </div>
                    )}
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
